<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お題 - AnonymousRanker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>お題</h1>
    <div class="card">
        <form th:action="@{${action}}" th:object="${form}" method="post">
            <ul class="error" th:if="${#fields.hasErrors('*')}">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
            <label for="prompt">お題の内容</label>
            <input type="text" id="prompt" th:field="*{prompt}" placeholder="例: 一番料理が上手いと思う人は？">
            <div class="btn-row">
                <button type="submit">保存する</button>
                <a class="btn secondary" th:href="@{/s/{token}/admin(token=${adminToken})}">戻る</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
