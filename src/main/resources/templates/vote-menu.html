<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${meeting.title}">AnonymousRanker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1 th:text="${meeting.title}">会のタイトル</h1>
    <div class="card">
        <a class="btn" style="width:100%;text-align:center" th:href="@{/vote/{token}/vote(token=${votingToken})}">投票する</a>
    </div>
    <div class="card">
        <a class="btn secondary" style="width:100%;text-align:center" th:href="@{/vote/{token}/watch(token=${votingToken})}">発表を見る</a>
    </div>
</div>
</body>
</html>
