<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${meeting.title} + ' - 投票'">投票</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <p class="error" th:if="${previewMode}" style="color:#ffcf6c">プレビューモード：ここでの操作は投票として記録されません</p>
    <h1 th:text="${meeting.title}">会のタイトル</h1>
    <p class="subtitle" th:text="|お題ごとに${votesPerTopic}人まで選んでください。あとから選び直すこともできます。|">説明</p>

    <form th:action="@{${action}}" method="post">
        <div class="card" th:each="tb : ${topicViews}">
            <h2 th:text="${tb.prompt}">お題</h2>

            <p class="muted" th:if="${tb.locked}">このお題はすでに発表されたため、投票を修正できません。</p>
            <p class="error" th:if="${tb.error}" th:text="${tb.error}"></p>

            <div th:unless="${tb.locked}" th:each="slot : ${#numbers.sequence(0, votesPerTopic - 1)}">
                <label th:text="|${slot + 1}人目|">n人目</label>
                <select th:name="'vote_' + ${tb.topicId} + '_' + ${slot}" class="ballot-select" th:attr="data-topic=${tb.topicId}">
                    <option value="">選択してください</option>
                    <option th:each="candidate : ${tb.candidates}"
                            th:value="${candidate.id}"
                            th:text="${candidate.name}"
                            th:selected="${tb.slotValues[slot]} != null and ${tb.slotValues[slot]} == ${candidate.id}">
                    </option>
                </select>
            </div>
        </div>

        <button type="submit">投票する</button>
    </form>
</div>
<script th:src="@{/js/ballot.js}"></script>
</body>
</html>
