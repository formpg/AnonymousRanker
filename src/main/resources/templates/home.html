<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnonymousRanker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>AnonymousRanker</h1>
    <p class="subtitle">仲間内で匿名投票をして、ランキングをルーレット演出で発表できるサイトです。</p>
    <div class="card">
        <h2>グループを新しく作成する</h2>
        <p class="muted">タイトル・グループID・開催日・メンバー・パスワードを決めてグループを作成します。</p>
        <a class="btn" style="width:100%;text-align:center" th:href="@{/sessions/new}">グループを新しく作成する</a>
    </div>
    <div class="card">
        <h2>以前作成したグループにログインする</h2>
        <p class="muted">作成時に設定したグループIDとパスワードで、同じグループにいつでも戻れます。</p>
        <a class="btn secondary" style="width:100%;text-align:center" th:href="@{/sessions/login}">以前作成したグループにログインする</a>
    </div>
</div>
</body>
</html>
