<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${meeting.title} + ' - 投票'">投票</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <p class="error" th:if="${previewMode}" style="color:#ffcf6c">プレビューモード：ここでの操作は投票として記録されません</p>
    <h1 th:text="${meeting.title}">会のタイトル</h1>
    <div class="card">
        <h2>あなたは誰ですか？</h2>
        <form th:action="@{${action}}" method="post">
            <label for="memberId">自分の名前を選択してください</label>
            <select id="memberId" name="memberId">
                <option th:each="member : ${meeting.members}" th:value="${member.id}" th:text="${member.name}"></option>
            </select>
            <button type="submit">この人として投票する</button>
        </form>
    </div>
</div>
</body>
</html>
