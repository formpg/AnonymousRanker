<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>グループにログイン - AnonymousRanker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>以前作成したグループにログイン</h1>
    <p class="subtitle">グループの作成時に入力したグループIDとパスワードを入力してください。</p>
    <div class="card">
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/sessions/login}" th:object="${form}" method="post">
            <label for="groupId">グループID</label>
            <input type="text" id="groupId" th:field="*{groupId}">

            <label for="password">パスワード</label>
            <input type="password" id="password" th:field="*{password}">

            <button type="submit">ログイン</button>
        </form>
    </div>
</div>
</body>
</html>
